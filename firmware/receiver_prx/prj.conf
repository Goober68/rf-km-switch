CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_ESB=y
CONFIG_DK_LIBRARY=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y

# Step 4e: USB HID composite.
#
# The PCA10059 board defconfig sets BOARD_REQUIRES_SERIAL_BACKEND_CDC_ACM=y,
# which defaults BOARD_SERIAL_BACKEND_CDC_ACM=y, which in turn defaults
# SERIAL=y, CONSOLE=y, UART_CONSOLE=y, USB_DEVICE_STACK_NEXT=y, AND
# CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y (see
# boards/common/usb/Kconfig.cdc_acm_serial.defconfig). That last one is the
# kicker — it pulls in subsys/usb/device_next/app/cdc_acm_serial.c, which
# at SYS_INIT(APPLICATION) defines its own usbd_context with PID 0x0004 and
# calls usbd_enable() before our main() ever runs. The USB device controller
# is then claimed; our HID-bearing sample_usbd silently loses the race.
#
# Setting CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n collapses that whole chain
# in one option. We re-enable just the pieces we need.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y

# Keep CDC ACM in our composite (will show up as a COM port on the host)
# for future logging. We don't write to it from Zephyr's console — that's
# disabled — but the class is registered so we can wire logs back in later
# without a USB-shape change.
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y

# Custom identity. VID stays at Zephyr's test 0x2FE3 — replace before any
# deployment outside this desk.
CONFIG_SAMPLE_USBD_PID=0x4b4d
CONFIG_SAMPLE_USBD_MANUFACTURER="rf-km-switch"
CONFIG_SAMPLE_USBD_PRODUCT="RF KM receiver"
